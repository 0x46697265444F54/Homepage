<!DOCTYPE html>
<html>
  <head>
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta charset="UTF-8" />
    <link rel="icon" href="favicon.png">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Maven+Pro&display=swap" />
    <!-- Docsify v5 -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify@5/dist/themes/core.min.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify@5/dist/themes/addons/core-dark.min.css" media="(prefers-color-scheme: dark)" />
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <!-- Stylesheet -->
    <link rel="stylesheet" href="./assets/style.css"/>
    <link rel="stylesheet" href="./assets/icons.css"/>
  </head>
  <body class="sidebar-toggle-chevron">
    <div id="app"></div>
    <script>
        window.$docsify = {
            name: "FireDOT",
            homepage: "_home.md",
            loadSidebar: "_sidebar.md",
            alias: {
                "/"           : "contents/_home.md",
                "/(.*)"       : "contents/$1",
            },
            cornerExternalLinkTarget: "_self",
            auto2top: true,
            subMaxLevel: 1,
            executeScript: true,
            pagination: {
                previousText: "POPRZEDNIE",
                nextText: "NASTĘPNE"
            }
        }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/js-yaml@4.1.0/dist/js-yaml.min.js"></script>
    <!-- Plugins -->
    <script src="./assets/js/plugins/extra-markdown.js"></script>
    <script src="./assets/js/plugins/farming.js"></script>
    <script src="./assets/js/plugins/images.js"></script>
    <script src="./assets/js/plugins/modals.js"></script>
    <script src="./assets/js/plugins/notice.js"></script>
    <script src="./assets/js/plugins/page.js"></script>
    <script src="./assets/js/plugins/search.js"></script>
    <script src="./assets/js/plugins/server.js"></script>
    <script src="./assets/js/plugins/tooltips.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2/dist/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/tippy.js@6/dist/tippy-bundle.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/docsify@5/dist/docsify.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/docsify@5/dist/plugins/zoom-image.min.js"></script>
    <script src="https://unpkg.com/docsify-pagination/dist/docsify-pagination.min.js"></script>
  </body>
</html>
