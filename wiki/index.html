<!DOCTYPE html>
<html>
  <head>
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta charset="UTF-8" />
    <link rel="icon" href="favicon.png">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Maven+Pro&display=swap" />
    <!-- Docsify v5 -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify@5/dist/themes/core.min.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify@5/dist/themes/addons/core-dark.min.css" media="(prefers-color-scheme: dark)" />
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <!-- Stylesheet -->
    <link rel="stylesheet" href="./assets/style.css"/>
    <link rel="stylesheet" href="./assets/icons.css"/>
  </head>
  <body class="sidebar-toggle-chevron">
    <div id="app"></div>
    <script>
        window.$docsify = {
            name: "FireDOT",
            homepage: "_home.md",
            loadSidebar: "_sidebar.md",
            alias: {
                "/"           : "contents/_home.md",
                "/(.*)"       : "contents/$1",
            },
            cornerExternalLinkTarget: "_self",
            auto2top: true,
            subMaxLevel: 1,
            executeScript: true,
            pagination: {
                previousText: "POPRZEDNIE",
                nextText: "NASTĘPNE"
            },
            plugins: [
                function(hook, vm) {
                    hook.doneEach(function() {
                        // Adding [WIKI] styled text to the sidebar name.
                        document.querySelectorAll('.app-name-link').forEach(it => {
                            if (it.children.length === 0) {
                                it.insertAdjacentHTML('beforeend', '<span class="app-name-tag">26.2</span>')
                            }
                        });
                        // Updating website title.
                        if (document.title === window.$docsify.name)
                            document.title = "Strona Główna | FireDOT"
                        else document.title = document.title.replace(" - " + window.$docsify.name, " | FireDOT");
                    });
                },
                function pageFooter(hook) {
                    const footer = [
                        "<hr>",
                        "<footer>",
                            "<span>FireDOT &copy; 2026</span>",
                            "<span>Not affiliated with, or approved by 'Mojang Studios', 'Microsoft', or any other mentioned entities. All trademarks and copyrights are the property of their respective owners.</span>",
                        "</footer>"
                    ]
                    hook.afterEach(html => {
                        return html + footer.join("");
                    });
                }
            ]
        }
    </script>
    <script src="./assets/js/extra-markdown.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/docsify@5/dist/docsify.min.js"></script>
    <script src="https://unpkg.com/docsify-pagination/dist/docsify-pagination.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/docsify@5/dist/plugins/zoom-image.min.js"></script>
  </body>
</html>
