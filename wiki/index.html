<!DOCTYPE html>
<html>
  <head>
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta charset="UTF-8" />
    <link rel="icon" href="favicon.png">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Maven+Pro&display=swap" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Ubuntu+Mono&display=swap" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans&display=swap" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify@^5.0.0-rc/dist/themes/core.min.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify@^5.0.0-rc/dist/themes/addons/core-dark.min.css" media="(prefers-color-scheme: dark)" />
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="./assets/style.css"/>
  </head>
  <body class="sidebar-toggle-chevron">
    <div id="app"></div>
    <script>
        window.$docsify = {
            name: "FIREDOT.PL",
            homepage: "contents/_home.md",
            loadNavbar: "contents/_navbar.md",
            loadSidebar: "contents/_sidebar.md",
            alias: {
                "/regulamin"    : "contents/regulamin",
                "/nawigacja"    : "contents/nawigacja",
                "/generator"    : "contents/generator",
                "/receptury"    : "contents/receptury",
                "/rolnictwo"    : "contents/rolnictwo",
                "/teleportacja" : "contents/teleportacja",
                "/ekonomia"     : "contents/ekonomia",
                "/tereny"       : "contents/tereny",
                "/zaklecia"     : "contents/zaklecia",
                "/przedmioty"   : "contents/przedmioty",
                "/nowosci"      : "contents/nowosci",
                "/inne"         : "contents/inne",
            },
            cornerExternalLinkTarget: "_self",
            auto2top: true,
            subMaxLevel: 1,
            pagination: {
                previousText: "POPRZEDNIE",
                nextText: "NASTĘPNE"
            },
            plugins: [
                function(hook, vm) {
                    hook.doneEach(function() {
                        if (document.title === window.$docsify.name)
                            document.title = "Strona Główna | FireDOT"
                        else document.title = document.title.replace(" - " + window.$docsify.name, " | FireDOT");
                    });
                }
            ]
        }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/docsify@^5.0.0-rc/dist/docsify.min.js"></script>
    <script src="https://unpkg.com/docsify-pagination/dist/docsify-pagination.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/docsify@^5.0.0-rc/dist/plugins/zoom-image.min.js"></script>
  </body>
</html>
